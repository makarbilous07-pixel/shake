<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Змейка</title>
<style>
:root{--bg:#f4f6f1;--fg:#1d2a1d;--grid:#e3e9dc;--board:#fbfdf9;--snake:#2f9e44;--head:#1b6b2c;--food:#e03131;--btn:#dfe7d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101510;--fg:#e6efe3;--grid:#1c261c;--board:#151c15;--snake:#51cf66;--head:#8ce99a;--food:#ff6b6b;--btn:#243024}}
:root[data-theme="dark"]{--bg:#101510;--fg:#e6efe3;--grid:#1c261c;--board:#151c15;--snake:#51cf66;--head:#8ce99a;--food:#ff6b6b;--btn:#243024}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none;overflow:hidden}
.bar{display:flex;gap:24px;font-size:18px;font-weight:600}
.bar span b{font-variant-numeric:tabular-nums}
canvas{touch-action:none;border-radius:12px;background:var(--board);box-shadow:0 2px 12px rgba(0,0,0,.15);max-width:100%}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
.pad button{font-size:24px;border:0;border-radius:16px;background:var(--btn);color:var(--fg);touch-action:manipulation}
.pad button:active{filter:brightness(.9)}
.up{grid-column:2;grid-row:1}.lf{grid-column:1;grid-row:2}.dn{grid-column:2;grid-row:2}.rt{grid-column:3;grid-row:2}
.ps{grid-column:3;grid-row:1;font-size:18px!important}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f9e44">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="bar"><span>Счёт: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
<canvas id="c"></canvas>
<div class="pad">
<button class="up" data-d="U">▲</button>
<button class="ps" id="pause">⏸</button>
<button class="lf" data-d="L">◀</button>
<button class="dn" data-d="D">▼</button>
<button class="rt" data-d="R">▶</button>
</div>
<script>
const N=20, cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $score=document.getElementById('score'), $best=document.getElementById('best');
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
let size,cell,snake,dir,next,food,score,best=0,running=false,over=false,paused=false,timer;
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
$best.textContent=best;

function resize(){
  size=Math.floor(Math.min(innerWidth-24,innerHeight-230,460)/N)*N;
  const r=devicePixelRatio||1;
  cv.width=cv.height=size*r;cv.style.width=cv.style.height=size+'px';
  ctx.setTransform(r,0,0,r,0,0);cell=size/N;draw();
}
function reset(){
  snake=[[10,10],[9,10],[8,10]];dir=next='R';score=0;over=false;paused=false;
  $score.textContent=0;placeFood();
}
function placeFood(){
  do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}
  while(snake.some(s=>s[0]===food[0]&&s[1]===food[1]));
}
function start(){
  if(running)return;
  if(over||!snake)reset();
  running=true;paused=false;tick();
}
function tick(){
  if(!running)return;
  if(!paused){
    dir=next;
    const h=[snake[0][0]+V[dir][0],snake[0][1]+V[dir][1]];
    const eat=h[0]===food[0]&&h[1]===food[1];
    const body=eat?snake:snake.slice(0,-1);
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||body.some(s=>s[0]===h[0]&&s[1]===h[1])){
      running=false;over=true;
      if(score>best){best=score;$best.textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
      if(navigator.vibrate)navigator.vibrate(200);
      draw();return;
    }
    snake.unshift(h);
    if(eat){score++;$score.textContent=score;placeFood()}else snake.pop();
    draw();
  }
  timer=setTimeout(tick,Math.max(65,140-score*3));
}
function turn(d){
  const o={U:'D',D:'U',L:'R',R:'L'};
  if(o[d]!==dir)next=d;
  if(!running)start();
}
function draw(){
  const s=getComputedStyle(document.documentElement);
  const col=n=>s.getPropertyValue(n).trim();
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle=col('--grid');
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*cell,y*cell,cell,cell);
  if(!snake)reset();
  ctx.fillStyle=col('--food');
  ctx.beginPath();ctx.arc((food[0]+.5)*cell,(food[1]+.5)*cell,cell*.38,0,7);ctx.fill();
  snake.forEach((p,i)=>{
    ctx.fillStyle=col(i?'--snake':'--head');
    ctx.beginPath();ctx.roundRect(p[0]*cell+1,p[1]*cell+1,cell-2,cell-2,cell*.3);ctx.fill();
  });
  if(!running){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+cell*1.3+'px system-ui';
    ctx.fillText(over?'Игра окончена':'Змейка',size/2,size/2-cell*.4);
    ctx.font=cell*.8+'px system-ui';
    ctx.fillText(over?'Счёт: '+score+'. Коснись, чтобы снова':'Коснись или свайпни, чтобы начать',size/2,size/2+cell*1.1);
  }else if(paused){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+cell*1.3+'px system-ui';
    ctx.fillText('Пауза',size/2,size/2);
  }
}
// управление
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault()},{passive:false});
cv.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!running)start();return}
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));
  e.preventDefault();
},{passive:false});
cv.addEventListener('click',()=>{if(!running)start()});
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.d)));
document.getElementById('pause').addEventListener('click',()=>{if(running){paused=!paused;draw()}});
addEventListener('keydown',e=>{
  const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key];
  if(m){turn(m);e.preventDefault()}
  else if(e.key===' '){running?(paused=!paused,draw()):start()}
});
addEventListener('resize',resize);
resize();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
